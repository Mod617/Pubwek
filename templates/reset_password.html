{% extends "base.html" %}

{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>
  :root{
    --pf-ink:       #12261F;
    --pf-emerald:   #0F6B4C;
    --pf-emerald-2: #14875F;
    --pf-amber:     #F0A63C;
    --pf-bg:        #F4F2EC;
    --pf-surface:   #FFFFFF;
    --pf-line:      #E7E3D8;
    --pf-muted:     #6E7A73;
    --pf-danger:    #C6493D;
  }

  .pf-reset-wrap{
    background: var(--pf-bg);
    min-height: calc(100vh - 120px);
    display:flex; align-items:center; justify-content:center;
    padding: 3rem 1rem;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--pf-ink);
  }

  .pf-reset-card{
    width:100%; max-width: 440px;
    background: var(--pf-surface);
    border: 1px solid var(--pf-line);
    border-radius: 20px;
    box-shadow: 0 20px 45px -24px rgba(18,38,31,.25);
    overflow: hidden;
  }

  .pf-reset-top{
    background: linear-gradient(135deg, var(--pf-emerald) 0%, #0B5A40 100%);
    padding: 2.1rem 2rem 1.7rem;
    text-align:center; color:#fff; position:relative; overflow:hidden;
  }
  .pf-reset-top::after{
    content:""; position:absolute; right:-30px; top:-30px; width:130px; height:130px;
    background: radial-gradient(circle, rgba(255,255,255,.12) 0%, transparent 70%);
  }
  .pf-reset-icon{
    width:52px; height:52px; border-radius:50%;
    background: rgba(255,255,255,.15); border: 1.5px solid rgba(255,255,255,.35);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto .9rem; font-size:1.4rem;
  }
  .pf-reset-top h2{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.4rem; margin:0;
  }
  .pf-reset-top p{
    font-size:.85rem; margin:.35rem 0 0; color:#D9EEE3;
  }

  .pf-reset-body{ padding: 1.9rem 2rem 2.1rem; }

  .pf-field{ margin-bottom: 1.15rem; }
  .pf-field label{
    font-weight:600; font-size:.85rem; color: var(--pf-ink); margin-bottom:.4rem; display:block;
  }
  .pf-input-group{ position:relative; display:flex; }
  .pf-input-group input{
    flex:1; border:1.5px solid var(--pf-line); border-right:none; border-radius: 12px 0 0 12px;
    padding: .65rem .9rem; font-size:.95rem; background:#FBFAF7; color:var(--pf-ink);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .pf-input-group input:focus{
    outline:none; border-color: var(--pf-emerald); background:#fff;
    box-shadow: 0 0 0 3px rgba(15,107,76,.12);
  }
  .pf-toggle-eye{
    border:1.5px solid var(--pf-line); border-left:none; border-radius: 0 12px 12px 0;
    background:#F0EEE6; color: var(--pf-muted); padding: 0 .95rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: color .15s ease;
  }
  .pf-toggle-eye:hover{ color: var(--pf-emerald); }

  .pf-match-hint{
    display:flex; align-items:center; gap:.4rem; font-size:.78rem; margin-top:.5rem;
    color: var(--pf-muted); min-height: 1rem;
  }
  .pf-match-hint.is-match{ color: var(--pf-emerald-2); }
  .pf-match-hint.is-mismatch{ color: var(--pf-danger); }

  .pf-hint{ font-size:.78rem; color: var(--pf-muted); margin-top:.4rem; }

  .pf-submit{
    width:100%; background: var(--pf-amber); border:none; color:#3A2504; font-weight:700;
    border-radius: 999px; padding:.8rem 1rem; font-size:.98rem; margin-top:.4rem;
    box-shadow: 0 10px 20px -10px rgba(232,145,42,.65);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pf-submit:hover{ transform: translateY(-1px); box-shadow: 0 14px 24px -10px rgba(232,145,42,.75); color:#3A2504; }

  @media (max-width: 420px){
    .pf-reset-top{ padding: 1.7rem 1.5rem 1.4rem; }
    .pf-reset-body{ padding: 1.6rem 1.5rem 1.8rem; }
  }
</style>

<div class="pf-reset-wrap">
  <div class="pf-reset-card">
    <div class="pf-reset-top">
      <div class="pf-reset-icon"><i class="bi bi-shield-lock"></i></div>
      <h2>Nouveau mot de passe</h2>
      <p>Choisissez un mot de passe sécurisé pour votre compte Pubwek</p>
    </div>

    <div class="pf-reset-body">
      <form method="POST" action="" id="pf-reset-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="pf-field">
          <label for="password">Nouveau mot de passe</label>
          <div class="pf-input-group">
            <input type="password" id="password" name="password" placeholder="••••••" required minlength="6">
            <button type="button" class="pf-toggle-eye" onclick="togglePasswordVisibility('password', this)" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="pf-hint">6 caractères minimum.</div>
        </div>

        <div class="pf-field">
          <label for="confirm_password">Confirmer le mot de passe</label>
          <div class="pf-input-group">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••" required minlength="6">
            <button type="button" class="pf-toggle-eye" onclick="togglePasswordVisibility('confirm_password', this)" tabindex="-1">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="pf-match-hint" id="pf-match-hint"></div>
        </div>

        <button type="submit" class="pf-submit">
          <i class="bi bi-check-circle me-1"></i> Réinitialiser mon mot de passe
        </button>
      </form>
    </div>
  </div>
</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const icon = btn.querySelector("i");
  if (field.type === "password") {
    field.type = "text";
    icon.classList.remove("bi-eye");
    icon.classList.add("bi-eye-slash");
  } else {
    field.type = "password";
    icon.classList.remove("bi-eye-slash");
    icon.classList.add("bi-eye");
  }
}

(function(){
  const pwd = document.getElementById('password');
  const confirm = document.getElementById('confirm_password');
  const hint = document.getElementById('pf-match-hint');

  function checkMatch(){
    if (!confirm.value) {
      hint.textContent = '';
      hint.className = 'pf-match-hint';
      return;
    }
    if (pwd.value === confirm.value) {
      hint.innerHTML = '<i class="bi bi-check-circle-fill"></i> Les mots de passe correspondent';
      hint.className = 'pf-match-hint is-match';
    } else {
      hint.innerHTML = '<i class="bi bi-x-circle-fill"></i> Les mots de passe ne correspondent pas';
      hint.className = 'pf-match-hint is-mismatch';
    }
  }
  pwd.addEventListener('input', checkMatch);
  confirm.addEventListener('input', checkMatch);
})();
</script>
{% endblock %}
