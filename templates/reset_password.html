{% extends "base.html" %}
{% block content %}
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Nouveau mot de passe</h2>

    <form method="POST" action="">
      <div class="mb-3">
        <label for="password" class="form-label">Nouveau mot de passe</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••" required minlength="6">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('password', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label for="confirm_password" class="form-label">Confirmer le mot de passe</label>
        <div class="input-group">
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••" required minlength="6">
          <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('confirm_password', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg">Réinitialiser mon mot de passe</button>
      </div>
    </form>
  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <script>
  function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    const icon = btn.querySelector("i");

    if (field.type === "password") {
      field.type = "text";
      icon.classList.remove("bi-eye");
      icon.classList.add("bi-eye-slash");
    } else {
      field.type = "password";
      icon.classList.remove("bi-eye-slash");
      icon.classList.add("bi-eye");
    }
  }
  </script>
{% endblock %}
