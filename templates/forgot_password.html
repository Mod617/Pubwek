{% extends "base_v2.html" %}

{% block content %}
<section class="py-space-lg md:py-space-xl bg-gradient-to-b from-canvas-cream via-surface-container-low to-background">
<div class="w-full max-w-md mx-auto px-margin">

  <div class="pw-card">

    <!-- En-tete -->
    <div class="text-center space-y-1 mb-space-md">
      <div class="w-12 h-12 mx-auto rounded-xl bg-amber-soft text-amber-rich flex items-center justify-center">
        <span class="material-symbols-outlined text-[26px]">key</span>
      </div>
      <span class="pw-badge bg-surface-container text-on-surface-variant">Récupération de compte</span>
      <h1 class="font-headline-md text-headline-md md:text-headline-lg text-slate-night">Mot de passe oublié</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Entrez l'adresse email associée à votre compte. Nous vous enverrons un lien
        pour choisir un nouveau mot de passe.
      </p>
    </div>

    <form method="POST" action="" class="space-y-space-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div>
        <label for="email" class="pw-label">Adresse email</label>
        <input type="email" class="pw-input" id="email" name="email"
               placeholder="ex: utilisateur@gmail.com" required>
      </div>

      <div class="pt-space-xs">
        <button type="submit" class="pw-btn pw-btn-md pw-btn-primary w-full">
          <span class="material-symbols-outlined text-[20px]">send</span>
          Envoyer le lien de réinitialisation
        </button>
      </div>
      <p class="text-center font-body-sm text-body-sm text-on-surface-variant">
        <a class="font-semibold text-emerald-primary hover:text-emerald-deep hover:underline" href="{{ url_for('login') }}">Retour à la connexion</a>
      </p>
    </form>

  </div>
</div>
</section>
{% endblock %}
