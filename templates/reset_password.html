{% extends "base_v2.html" %}

{% block content %}
<section class="py-space-lg md:py-space-xl bg-gradient-to-b from-canvas-cream via-surface-container-low to-background">
<div class="w-full max-w-md mx-auto px-margin">

  <div class="pw-card">

    <!-- En-tete -->
    <div class="text-center space-y-1 mb-space-md">
      <div class="w-12 h-12 mx-auto rounded-xl bg-brand-light text-brand-deep flex items-center justify-center">
        <span class="material-symbols-outlined text-[26px]">shield</span>
      </div>
      <h1 class="font-headline-md text-headline-md md:text-headline-lg text-slate-night">Nouveau mot de passe</h1>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Choisissez un mot de passe sécurisé pour votre compte Pubwek
      </p>
    </div>

    <form method="POST" action="" id="pf-reset-form" class="space-y-space-sm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Nouveau mot de passe -->
      <div>
        <label for="password" class="pw-label">Nouveau mot de passe</label>
        <div class="relative">
          <input type="password" id="password" name="password" class="pw-input pr-12"
                 placeholder="••••••" required minlength="6">
          <button type="button" tabindex="-1"
                  class="absolute inset-y-0 right-0 flex items-center px-space-md text-on-surface-variant hover:text-slate-midnight transition-colors"
                  onclick="togglePasswordVisibility('password', this)" aria-label="Afficher le mot de passe">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
        <p class="pw-help">6 caractères minimum.</p>
      </div>

      <!-- Confirmation -->
      <div>
        <label for="confirm_password" class="pw-label">Confirmer le mot de passe</label>
        <div class="relative">
          <input type="password" id="confirm_password" name="confirm_password" class="pw-input pr-12"
                 placeholder="••••••" required minlength="6">
          <button type="button" tabindex="-1"
                  class="absolute inset-y-0 right-0 flex items-center px-space-md text-on-surface-variant hover:text-slate-midnight transition-colors"
                  onclick="togglePasswordVisibility('confirm_password', this)" aria-label="Afficher le mot de passe">
            <span class="material-symbols-outlined text-[20px]">visibility</span>
          </button>
        </div>
        <p class="pw-help hidden items-center gap-1" id="pf-match-hint"></p>
      </div>

      <div class="pt-space-xs">
        <button type="submit" class="pw-btn pw-btn-md pw-btn-primary w-full">
          <span class="material-symbols-outlined text-[20px]">check_circle</span>
          Réinitialiser mon mot de passe
        </button>
      </div>
    </form>

  </div>
</div>
</section>

<script>
function togglePasswordVisibility(fieldId, btn) {
  const field = document.getElementById(fieldId);
  const icon = btn.querySelector(".material-symbols-outlined");
  if (field.type === "password") {
    field.type = "text";
    icon.textContent = "visibility_off";
    btn.setAttribute("aria-label", "Masquer le mot de passe");
  } else {
    field.type = "password";
    icon.textContent = "visibility";
    btn.setAttribute("aria-label", "Afficher le mot de passe");
  }
}

(function(){
  const pwd = document.getElementById('password');
  const confirm = document.getElementById('confirm_password');
  const hint = document.getElementById('pf-match-hint');

  const BASE = 'pw-help flex items-center gap-1 ';

  function checkMatch(){
    if (!confirm.value) {
      hint.textContent = '';
      hint.className = 'pw-help hidden';
      return;
    }
    if (pwd.value === confirm.value) {
      hint.innerHTML = '<span class="material-symbols-outlined text-[16px]">check_circle</span> Les mots de passe correspondent';
      hint.className = BASE + 'font-semibold text-brand-primary';
    } else {
      hint.innerHTML = '<span class="material-symbols-outlined text-[16px]">cancel</span> Les mots de passe ne correspondent pas';
      hint.className = BASE + 'font-semibold text-error';
    }
  }
  pwd.addEventListener('input', checkMatch);
  confirm.addEventListener('input', checkMatch);
})();
</script>
{% endblock %}
