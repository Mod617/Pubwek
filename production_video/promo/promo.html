<!doctype html><html><head><meta charset=utf-8><link rel="stylesheet" href="file:///home/user/Pubwek/static/css/fonts.css">
<style>*{margin:0;box-sizing:border-box}body{width:540px;height:960px;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif}
#bg{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,#FFE4EF,#F9A8D4 60%,#DB2777)}
.t{position:absolute;left:0;right:0;text-align:center;color:#831843}
</style></head><body><div id=bg></div>
<div id=sp style="position:absolute;inset:0"></div>
<div class=t id=t1 style="top:150px;font:800 26px 'Plus Jakarta Sans';letter-spacing:6px">PÂTISSERIE</div>
<div class=t id=t2 style="top:180px;font:800 58px 'Plus Jakarta Sans';letter-spacing:-1px;color:#9D174D">Doux Matin</div>
<svg id=cake style="position:absolute;left:120px;top:290px" width="300" height="270" viewBox="0 0 200 180">
 <ellipse cx="100" cy="166" rx="90" ry="10" fill="#9D174D" opacity=".25"/>
 <rect x="30" y="100" width="140" height="62" rx="10" fill="#FFF7ED"/><path d="M30 108 q17 14 35 0 q17 14 35 0 q17 14 35 0 q17 14 35 0 v-8 h-140z" fill="#F472B6"/>
 <rect x="48" y="58" width="104" height="46" rx="9" fill="#FFFBEB"/><path d="M48 66 q13 11 26 0 q13 11 26 0 q13 11 26 0 q13 11 26 0 v-8 h-104z" fill="#EC4899"/>
 <g fill="#BE185D"><circle cx="48" cy="136" r="5"/><circle cx="74" cy="142" r="5"/><circle cx="100" cy="136" r="5"/><circle cx="126" cy="142" r="5"/><circle cx="152" cy="136" r="5"/></g>
 <g fill="#FBBF24"><rect x="70" y="32" width="6" height="26" rx="2"/><rect x="97" y="26" width="6" height="32" rx="2"/><rect x="124" y="32" width="6" height="26" rx="2"/></g>
 <g id=fl fill="#F97316"><ellipse cx="73" cy="27" rx="5" ry="8"/><ellipse cx="100" cy="21" rx="5" ry="8"/><ellipse cx="127" cy="27" rx="5" ry="8"/></g>
</svg>
<div class=t id=t3 style="top:250px;font:800 26px 'Plus Jakarta Sans';letter-spacing:3px;color:#9D174D">SUR COMMANDE</div>


<script>
const $=i=>document.getElementById(i),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,d)=>cl((t-a)/d),eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let h='';for(let i=0;i<26;i++)h+=`<div class=s style="position:absolute;left:${(i*97)%540}px;top:${(i*173)%960}px;width:${6+i%4*3}px;height:${6+i%4*3}px;border-radius:50%;background:#fff"></div>`;$('sp').innerHTML=h;
function pop(id,t,a){const k=P(t,a,.5);$(id).style.opacity=cl(k*3);$(id).style.transform=`translateY(${(1-eo(k))*30}px) scale(${.7+.3*back(k)})`;}
window.render=t=>{pop('t1',t,.1);pop('t2',t,.3);const c=P(t,.2,.7);$('cake').style.transform=`scale(${.4+.6*back(c)}) rotate(${Math.sin(t*2)*2}deg)`;$('cake').style.opacity=cl(c*3);
 pop('t3',t,.9);
 $('fl').style.transform=`translateY(${Math.sin(t*20)*.6}px)`;
 document.querySelectorAll('.s').forEach((s,i)=>{s.style.opacity=.3+.6*Math.abs(Math.sin(t*2+i));s.style.transform=`translateY(${-((t*40+i*30)%80)}px)`;});};
render(0);
</script></body></html>
