{% extends "base.html" %}
{% block content %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  .reset-wrap {
    --paper:        #F5F3ED;
    --paper-raised: #FFFFFF;
    --ink:          #1B2A2E;
    --ink-soft:     #5B6B6C;
    --line:         #E3DFD3;
    --emerald:      #2F6F5E;
    --emerald-dark: #1F4F42;
    --emerald-tint: #E7F0EC;
    --slate-tint:   #EFEDE4;

    background: var(--paper);
    padding: 3.5rem 1.25rem 4.5rem;
    margin: -1.5rem calc(50% - 50vw) 0;
    padding-left: calc(1.25rem + (50vw - 50%));
    padding-right: calc(1.25rem + (50vw - 50%));
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    min-height: 80vh;
    display: flex;
    align-items: center;
  }

  .reset-card {
    max-width: 460px;
    margin: 0 auto;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 2.6rem 2.2rem;
    box-shadow: 0 1px 2px rgba(27,42,46,0.05);
    width: 100%;
  }

  .reset-glyph {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--emerald-tint);
    color: var(--emerald-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.35rem;
    margin: 0 auto 1.2rem;
  }

  .reset-eyebrow {
    display: block;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--emerald);
    margin-bottom: 0.6rem;
  }

  .reset-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.65rem;
    text-align: center;
    color: var(--ink);
    margin-bottom: 0.7rem;
  }

  .reset-subtitle {
    text-align: center;
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.55;
    margin-bottom: 1.9rem;
  }

  .reset-wrap .form-label {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .reset-wrap .form-control {
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 0.65rem 0.9rem;
    font-family: 'Inter', sans-serif;
  }
  .reset-wrap .form-control:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 0.2rem var(--emerald-tint);
  }

  .reset-wrap .btn-primary {
    background: var(--emerald) !important;
    border: none !important;
    border-radius: 10px !important;
    font-weight: 700;
    letter-spacing: 0.01em;
    transition: background .15s ease, transform .15s ease;
  }
  .reset-wrap .btn-primary:hover {
    background: var(--emerald-dark) !important;
    transform: translateY(-1px);
  }

  .reset-wrap .btn-secondary {
    background: var(--paper-raised) !important;
    border: 1px solid var(--line) !important;
    color: var(--ink) !important;
    border-radius: 10px !important;
    font-weight: 600;
    transition: border-color .15s ease, transform .15s ease;
  }
  .reset-wrap .btn-secondary:hover {
    border-color: var(--emerald) !important;
    color: var(--emerald-dark) !important;
    transform: translateY(-1px);
  }
</style>

<div class="reset-wrap">
  <div class="container">
    <div class="reset-card">
      <div class="reset-glyph">🔑</div>
      <span class="reset-eyebrow">Récupération de compte</span>
      <h2 class="reset-title">Mot de passe oublié</h2>
      <p class="reset-subtitle">
        Entrez l'adresse email associée à votre compte. Nous vous enverrons un lien
        pour choisir un nouveau mot de passe.
      </p>
      <form method="POST" action="">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="email" class="form-label">Adresse email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="ex: utilisateur@gmail.com" required>
        </div>
        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary btn-lg">Envoyer le lien de réinitialisation</button>
          <a href="{{ url_for('login') }}" class="btn btn-secondary btn-lg">⬅ Retour à la connexion</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
