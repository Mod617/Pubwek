<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Téléphone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <!-- Carte -->
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Vérification du téléphone 📱</h4>
                    </div>
                    <div class="card-body">

                        <!-- Messages flash -->
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                              </div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label for="otp" class="form-label">Entrez le code OTP reçu par SMS :</label>
                                <input type="text" class="form-control" id="otp" name="otp" placeholder="Ex: 123456" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Vérifier ✅</button>
                        </form>

                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">↩ Retour à la connexion</a>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
